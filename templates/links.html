<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title = ${singlePage != null ? singlePage.spec.title : '朋友们'}, content = ~{::content}, head = ~{::head})}">
<th:block th:fragment="head">
  <link rel="stylesheet" th:href="@{/assets/css/links.css}" />
</th:block>
<th:block th:fragment="content">
  <main class="main">
    <!-- PJAX：页面脚本置于 content 内，随局部刷新重新执行 -->
    <script th:src="@{/assets/js/links.js}" defer></script>
    <div class="container">
      <section class="links-hero" data-aos="fade-up">
        <h1 class="links-hero-title" th:text="${(theme.config.watermark?.links?.enabled == true ? theme.config.watermark.links.title : null) ?: (singlePage != null ? singlePage.spec.title : '朋友们')}">朋友们</h1>
        <p class="links-hero-desc" th:text="${(theme.config.watermark?.links?.enabled == true ? theme.config.watermark.links.subtitle : null) ?: '海内存知己，天涯若比邻'}">海内存知己，天涯若比邻</p>
        <div class="links-hero-stats" th:with="totalLinks = ${#lists.isEmpty(groups) ? 0 : #aggregates.sum(groups.![links.size()])}">
          <span class="links-count">已收录 <strong th:text="${totalLinks}">0</strong> 位朋友</span>
          <button class="links-random-btn" onclick="visitRandomLink()" aria-label="随机访问一位友链">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            随机访问
          </button>
        </div>
      </section>

      <section class="link-section" data-aos="fade-up" data-aos-delay="100">
        <div class="links-toolbar" th:if="${groups != null && !#lists.isEmpty(groups)}">
          <div class="links-filter-bar">
            <div class="links-group-filters" aria-label="友链分组筛选">
              <button class="links-filter-chip active" type="button" data-link-filter="all">
                <span>全部友链</span>
                <em th:text="${#lists.isEmpty(groups) ? 0 : #aggregates.sum(groups.![links.size()])}">0</em>
              </button>
              <button th:each="group : ${groups}"
                      class="links-filter-chip"
                      type="button"
                      th:with="groupName=${#strings.isEmpty(group.spec.displayName) ? '空白分类' : group.spec.displayName}"
                      th:attr="data-link-filter=${groupName}">
                <span th:text="${groupName}">分组</span>
                <em th:text="${group.links == null ? 0 : group.links.size()}">0</em>
              </button>
            </div>
            <div class="links-toolbar-actions">
              <label class="links-search" aria-label="搜索友链">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input id="linksSearchInput" type="search" placeholder="搜索邻居名、域名或描述..." autocomplete="off" />
                <button class="links-search-clear" type="button" aria-label="clear" hidden>&times;</button>
              </label>
              <button class="links-apply-trigger" type="button" th:if="${linkApplicationEnabled}" onclick="openLinkApplication()" aria-controls="linkApplicationModal" aria-expanded="false">
                <span>申请友链</span>
              </button>
            </div>
          </div>
        </div>

        <div class="links-board links-board-stream"
             data-links-board
             th:attr="data-default-mode=${theme.config.links != null && theme.config.links.linksConfig != null && theme.config.links.linksConfig.displayMode != null ? theme.config.links.linksConfig.displayMode : 'stream'}"
             th:if="${groups != null && !#lists.isEmpty(groups)}">
          <div class="link-grid">
          <th:block th:each="group, groupStat : ${groups}">
            <a th:each="link, linkStat : ${group.links}" 
               th:href="${link.spec.url}" 
               class="link-card" 
               data-link 
               target="_blank" 
               rel="noopener"
               data-aos="zoom-in"
               th:with="groupName=${#strings.isEmpty(group.spec.displayName) ? '空白分类' : group.spec.displayName}"
               th:attr="data-aos-delay=${150 + groupStat.index * 50 + linkStat.index * 30},
                        data-link-name=${link.spec.displayName},
                        data-link-desc=${link.spec.description},
                        data-link-cover=${link.spec.cover},
                        data-link-group=${groupName}">
              <div class="link-avatar-wrap">
                <img th:if="${link.spec.logo}" 
                     class="link-avatar" 
                     th:src="${link.spec.logo}" 
                     th:alt="${link.spec.displayName}"
                     loading="lazy"
                     referrerpolicy="no-referrer"
                     onerror="this.onerror=null;this.style.display='none';if(this.nextElementSibling){this.nextElementSibling.style.display='flex';}" />
                <div th:if="${link.spec.logo}" class="link-avatar-placeholder" style="display:none;" aria-hidden="true">
                  <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M938.666667 512v307.456a73.685333 73.685333 0 0 1-106.666667 65.877333 123.349333 123.349333 0 0 0-123.562667 7.68 123.392 123.392 0 0 1-136.874666 0l-15.061334-9.984a80.256 80.256 0 0 0-89.002666 0l-15.061334 10.026667a123.392 123.392 0 0 1-136.874666 0 123.349333 123.349333 0 0 0-123.605334-7.68A73.685333 73.685333 0 0 1 85.333333 819.413333V512C85.333333 276.352 276.352 85.333333 512 85.333333s426.666667 191.018667 426.666667 426.666667zM403.072 614.314667a32 32 0 1 0-38.144 51.370666A246.016 246.016 0 0 0 512 714.666667a246.016 246.016 0 0 0 147.072-48.981334 32 32 0 1 0-38.144-51.370666A182.058667 182.058667 0 0 1 512 650.666667a182.058667 182.058667 0 0 1-108.928-36.352zM682.666667 405.333333c0-35.328-19.114667-64-42.666667-64s-42.666667 28.672-42.666667 64 19.114667 64 42.666667 64 42.666667-28.672 42.666667-64zM384 469.333333c23.552 0 42.666667-28.672 42.666667-64S407.552 341.333333 384 341.333333s-42.666667 28.672-42.666667 64 19.114667 64 42.666667 64z"/>
                  </svg>
                </div>
                <div th:unless="${link.spec.logo}" class="link-avatar-placeholder" aria-hidden="true">
                  <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M938.666667 512v307.456a73.685333 73.685333 0 0 1-106.666667 65.877333 123.349333 123.349333 0 0 0-123.562667 7.68 123.392 123.392 0 0 1-136.874666 0l-15.061334-9.984a80.256 80.256 0 0 0-89.002666 0l-15.061334 10.026667a123.392 123.392 0 0 1-136.874666 0 123.349333 123.349333 0 0 0-123.605334-7.68A73.685333 73.685333 0 0 1 85.333333 819.413333V512C85.333333 276.352 276.352 85.333333 512 85.333333s426.666667 191.018667 426.666667 426.666667zM403.072 614.314667a32 32 0 1 0-38.144 51.370666A246.016 246.016 0 0 0 512 714.666667a246.016 246.016 0 0 0 147.072-48.981334 32 32 0 1 0-38.144-51.370666A182.058667 182.058667 0 0 1 512 650.666667a182.058667 182.058667 0 0 1-108.928-36.352zM682.666667 405.333333c0-35.328-19.114667-64-42.666667-64s-42.666667 28.672-42.666667 64 19.114667 64 42.666667 64 42.666667-28.672 42.666667-64zM384 469.333333c23.552 0 42.666667-28.672 42.666667-64S407.552 341.333333 384 341.333333s-42.666667 28.672-42.666667 64 19.114667 64 42.666667 64z"/>
                  </svg>
                </div>
              </div>
              <div class="link-info">
                <span class="link-name" th:text="${link.spec.displayName}">链接名称</span>
                <span class="link-desc" th:text="${link.spec.description}">链接描述</span>
              </div>
              <span class="link-group-tag" th:text="${groupName}">分组</span>
            </a>
          </th:block>
          </div>
          <div class="links-empty-state" hidden>
            <span>没有找到匹配的友链</span>
          </div>
        </div>
        <div class="link-cover-preview" data-link-cover-preview hidden
             th:if="${theme.config.links != null && theme.config.links.linksConfig != null && theme.config.links.linksConfig.showCoverPreview != false}"
             th:attr="data-loading-gif=${theme.config.links != null && theme.config.links.linksConfig != null ? theme.config.links.linksConfig.coverPreviewLoadingGif : ''}">
          <div class="link-cover-preview-loading" data-cover-loading hidden><span></span><span></span><span></span></div>
          <img class="link-cover-preview-image" data-cover-image alt="博客首页预览" hidden>
          <div class="link-cover-preview-message" data-cover-message></div>
        </div>
        <div th:if="${groups == null || #lists.isEmpty(groups)}" class="plugin-notice">
          <div class="plugin-notice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
          </div>
          <h3 class="plugin-notice-title">暂无友链</h3>
          <p class="plugin-notice-desc">快去添加第一位朋友吧</p>
        </div>
      </section>

      <div class="link-apply" data-aos="fade-up" th:remove="all" th:if="${theme.config.links == null || theme.config.links.linksConfig == null || theme.config.links.linksConfig.enabled == null || theme.config.links.linksConfig.enabled}">
        <h2 class="link-apply-title">申请友链</h2>
        <p class="link-apply-desc">本站已接入星链，可通过星链在线邀请或自行提交友链申请。下方是本站信息，点击可一键复制。</p>
        <div class="link-apply-actions" th:if="${linkApplicationEnabled}">
          <button class="link-apply-submit" type="button" onclick="toggleLinkApplication()" title="提交友链" aria-controls="link-application-form" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>申请友链</span>
          </button>
        </div>
        <form id="link-application-form" class="link-application-form" th:if="${linkApplicationEnabled}" method="post" th:action="@{/links/apply/submit}" hidden>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="link-application-fields">
            <label>网站地址<input name="url" type="url" required></label>
            <label>网站名称<input name="displayName" required></label>
            <label>Logo 地址<input name="logo" type="url"></label>
            <label>博客首页图片（可选）<input name="cover" type="url" placeholder="首页截图或封面图片地址"></label>
            <label>网站描述<textarea name="description" rows="3"></textarea></label>
            <label>联系邮箱<input name="email" type="email"></label>
            <label>反链地址<input name="backlink" type="url"></label>
            <label>订阅地址<input name="feedUrls" type="url" placeholder="RSS/Atom 地址"></label>
            <div class="link-application-captcha">
              <img data-link-captcha alt="友链申请验证码" width="160" height="48">
              <label>验证码<input name="captchaCode" required minlength="5" maxlength="5" autocomplete="off"></label>
            </div>
          </div>
          <button type="submit" class="link-application-submit">提交申请</button>
        </form>
        <div class="link-apply-info" th:with="lc=${theme.config.links != null ? theme.config.links.linksConfig : null}">
          <span class="link-apply-item" onclick="copyApplyInfo(this)" title="点击复制"><span class="label">名称：</span><span class="link-apply-value" th:text="${(lc == null or #strings.isEmpty(lc.ownerName)) ? (theme.config.basic != null and theme.config.basic.siteInfo != null and theme.config.basic.siteInfo.title != null ? theme.config.basic.siteInfo.title : site.title) : lc.ownerName}">站点名称</span><span class="copy-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span></span>
          <span class="link-apply-item" onclick="copyApplyInfo(this)" title="点击复制"><span class="label">链接：</span><span class="link-apply-value" th:text="${(lc == null or #strings.isEmpty(lc.ownerUrl)) ? site.url : lc.ownerUrl}">站点链接</span><span class="copy-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span></span>
          <span class="link-apply-item" th:if="${(lc != null and !#strings.isEmpty(lc.ownerAvatar)) or !#strings.isEmpty(site.logo)}" onclick="copyApplyInfo(this)" title="点击复制"><span class="label">头像：</span><span class="link-apply-value" th:text="${(lc == null or #strings.isEmpty(lc.ownerAvatar)) ? site.logo : lc.ownerAvatar}">头像链接</span><span class="copy-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span></span>
          <span class="link-apply-item" onclick="copyApplyInfo(this)" title="点击复制"><span class="label">描述：</span><span class="link-apply-value" th:text="${(lc == null or #strings.isEmpty(lc.ownerDescription)) ? (theme.config.basic != null and theme.config.basic.siteInfo != null and theme.config.basic.siteInfo.description != null ? theme.config.basic.siteInfo.description : site.subtitle) : lc.ownerDescription}">站点描述</span><span class="copy-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span></span>
        </div>
      </div>
    </div>
  </main>

  <div id="linkApplicationModal" class="link-application-modal" th:if="${linkApplicationEnabled}" hidden>
    <div class="link-application-dialog" role="dialog" aria-modal="true" aria-labelledby="linkApplicationTitle">
      <div class="link-application-dialog-header">
        <h2 id="linkApplicationTitle">申请友链</h2>
        <button type="button" class="link-application-close" onclick="closeLinkApplication()" aria-label="关闭">&times;</button>
      </div>
      <p class="link-application-intro">本站已接入星链，可通过星链在线邀请或自行提交友链申请。</p>
      <div class="link-application-site" th:with="lc=${theme.config.links != null ? theme.config.links.linksConfig : null}">
        <div class="link-application-site-row">
          <span class="link-application-site-label">名称</span>
          <span class="link-application-site-value" th:attr="data-copy-value=${(lc == null or #strings.isEmpty(lc.ownerName)) ? (theme.config.basic != null and theme.config.basic.siteInfo != null and theme.config.basic.siteInfo.title != null ? theme.config.basic.siteInfo.title : site.title) : lc.ownerName}" th:text="${(lc == null or #strings.isEmpty(lc.ownerName)) ? (theme.config.basic != null and theme.config.basic.siteInfo != null and theme.config.basic.siteInfo.title != null ? theme.config.basic.siteInfo.title : site.title) : lc.ownerName}">本站名称</span>
          <button type="button" class="link-application-copy" onclick="copyApplicationValue(this)" aria-label="复制站点名称" title="复制"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2 2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
        <div class="link-application-site-row">
          <span class="link-application-site-label">地址</span>
          <span class="link-application-site-value" th:attr="data-copy-value=${(lc == null or #strings.isEmpty(lc.ownerUrl)) ? site.url : lc.ownerUrl}" th:text="${(lc == null or #strings.isEmpty(lc.ownerUrl)) ? site.url : lc.ownerUrl}">本站地址</span>
          <button type="button" class="link-application-copy" onclick="copyApplicationValue(this)" aria-label="复制站点地址" title="复制"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
        <div class="link-application-site-row" th:if="${(lc != null and !#strings.isEmpty(lc.ownerAvatar)) or !#strings.isEmpty(site.logo)}">
          <span class="link-application-site-label">头像</span>
          <span class="link-application-site-value" data-normalize-url th:attr="data-copy-value=${(lc == null or #strings.isEmpty(lc.ownerAvatar)) ? site.logo : lc.ownerAvatar}" th:text="${(lc == null or #strings.isEmpty(lc.ownerAvatar)) ? site.logo : lc.ownerAvatar}">头像链接</span>
          <button type="button" class="link-application-copy" onclick="copyApplicationValue(this)" aria-label="复制头像链接" title="复制"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
        <div class="link-application-site-row">
          <span class="link-application-site-label">描述</span>
          <span class="link-application-site-value" th:attr="data-copy-value=${(lc == null or #strings.isEmpty(lc.ownerDescription)) ? (theme.config.basic != null and theme.config.basic.siteInfo != null and theme.config.basic.siteInfo.description != null ? theme.config.basic.siteInfo.description : site.subtitle) : lc.ownerDescription}" th:text="${(lc == null or #strings.isEmpty(lc.ownerDescription)) ? (theme.config.basic != null and theme.config.basic.siteInfo != null and theme.config.basic.siteInfo.description != null ? theme.config.basic.siteInfo.description : site.subtitle) : lc.ownerDescription}">本站描述</span>
          <button type="button" class="link-application-copy" onclick="copyApplicationValue(this)" aria-label="复制站点描述" title="复制"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
      </div>
      <form class="link-application-form" method="post" th:action="@{/links/apply/submit}" onsubmit="return submitLinkApplication(event, this)">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="link-application-fields">
            <label>网站地址<input name="url" type="url" required></label>
            <label>网站名称<input name="displayName" required></label>
            <label>Logo 地址<input name="logo" type="url"></label>
            <label>博客首页图片（可选）<input name="cover" type="url" placeholder="首页截图或封面图片地址"></label>
            <label>联系邮箱<input name="email" type="email"></label>
            <label>反链地址<input name="backlink" type="url"></label>
            <label>订阅地址<input name="feedUrls" type="url" placeholder="RSS/Atom 地址"></label>
            <label class="link-application-description-field">网站描述<textarea name="description" rows="3"></textarea></label>
          <div class="link-application-captcha">
            <button type="button" class="link-application-captcha-refresh" onclick="refreshLinkApplicationCaptcha(this.closest('form'))" title="点击刷新验证码" aria-label="刷新验证码"><img data-link-captcha alt="友链申请验证码" width="160" height="48"></button>
              <label>验证码<input name="captchaCode" required minlength="5" maxlength="5" autocomplete="off"></label>
              <button type="submit" class="link-application-submit">提交申请</button>
            </div>
          </div>
      </form>
      <p class="link-application-feedback" role="status" aria-live="polite" hidden></p>
    </div>
  </div>
  <div id="linkApplicationToast" class="link-application-toast" role="status" aria-live="polite"></div>

  <div id="linkConfirmModal" class="link-confirm-modal">
    <div class="link-confirm-content">
      <div class="link-confirm-header">
        <span>即将离开本站访问，<strong class="link-target-name"></strong></span>
        <button class="link-confirm-close" onclick="closeLinkConfirm()" aria-label="关闭">&times;</button>
      </div>
      <div class="link-confirm-body">
        <p class="link-warning-text">本站不对外部链接内容负责，请注意甄别信息真伪。</p>
        <div class="link-confirm-actions">
          <button class="link-confirm-cta" type="button" onclick="confirmLinkVisit()" aria-label="确认前往外部站点">
            <span class="link-confirm-cta-label">继续前往</span>
            <span class="link-confirm-cta-icon" aria-hidden="true">
              <svg viewBox="0 0 66 43" fill="none">
                <path class="link-confirm-arrow link-confirm-arrow-one" d="M2 3L16 21.5L2 40"></path>
                <path class="link-confirm-arrow link-confirm-arrow-two" d="M24 3L38 21.5L24 40"></path>
                <path class="link-confirm-arrow link-confirm-arrow-three" d="M46 3L60 21.5L46 40"></path>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
  function copyApplyInfo(el) {
    var value = el && el.querySelector('.link-apply-value')?.textContent?.trim();
    if (!value || !navigator.clipboard) return;
    navigator.clipboard.writeText(value).then(function() {
      el.classList.add('copied');
      window.setTimeout(function() { el.classList.remove('copied'); }, 1500);
    });
  }

  function copyApplicationValue(button) {
    var value = button?.parentElement?.querySelector('.link-application-site-value')?.dataset?.copyValue?.trim();
    if (!value || !navigator.clipboard) return;
    navigator.clipboard.writeText(value).then(function() {
      button.classList.add('copied');
      showLinkApplicationMessage('已复制', 'success', 1500, false);
      window.setTimeout(function() { button.classList.remove('copied'); }, 1500);
    });
  }

  function openLinkApplication() {
    var modal = document.getElementById('linkApplicationModal');
    if (!modal) return;
    var feedback = modal.querySelector('.link-application-feedback');
    if (feedback) feedback.hidden = true;
    modal.querySelectorAll('[data-normalize-url]').forEach(function(element) {
      var value = element.dataset.copyValue?.trim();
      if (!value) return;
      try {
        var absoluteUrl = new URL(value, window.location.origin).href;
        element.textContent = absoluteUrl;
        element.dataset.copyValue = absoluteUrl;
      } catch (_) {}
    });
    var form = modal.querySelector('.link-application-form');
    if (form && form.dataset.captchaLoaded !== 'true') refreshLinkApplicationCaptcha(form);
    modal.hidden = false;
    document.body.classList.add('link-application-open');
    document.querySelector('.links-apply-trigger')?.setAttribute('aria-expanded', 'true');
    modal.querySelector('input[name="url"]')?.focus();
  }

  function toggleLinkApplication() { openLinkApplication(); }

  function refreshLinkApplicationCaptcha(container) {
    var scope = container || document;
    var captcha = scope.querySelector('img[data-link-captcha]');
    if (!captcha) return;
    var form = captcha.closest('form');
    if (form.dataset.captchaLoading === 'true' || form.dataset.submitting === 'true') return;
    var submit = form.querySelector('button[type="submit"]');
    var refresh = captcha.closest('button');
    if (refresh) refresh.disabled = true;
    form.dataset.captchaReady = 'false';
    form.dataset.captchaLoaded = 'false';
    form.dataset.captchaLoading = 'true';
    delete form.dataset.challengeId;
    form.querySelector('input[name="captchaCode"]').value = '';
    if (submit) submit.disabled = true;
    var finish = function() {
      form.dataset.captchaLoading = 'false';
      if (refresh) refresh.disabled = false;
    };
    captcha.onload = function() {
      form.dataset.captchaReady = 'true';
      form.dataset.captchaLoaded = 'true';
      finish();
      if (submit && form.dataset.submitting !== 'true') submit.disabled = false;
    };
    captcha.onerror = function() {
      form.dataset.captchaLoaded = 'false';
      finish();
      showLinkApplicationMessage('验证码加载失败，请点击验证码图片重试。', 'error', 5000);
    };
    fetch('/apis/api.link.halo.run/v1alpha1/link-applications/captcha', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: '{}',
      cache: 'no-store'
    }).then(function(response) {
      if (!response.ok) throw new Error('验证码加载失败（HTTP ' + response.status + '），请点击图片重试。');
      return response.json();
    }).then(function(challenge) {
      if (!challenge.challengeId || !challenge.image || !challenge.image.startsWith('data:image/')) {
        throw new Error('验证码接口返回异常，请确认使用 PluginLinks 2.5.0 或更新版本。');
      }
      form.dataset.challengeId = challenge.challengeId;
      form.dataset.captchaExpiresAt = String(Date.now() + Number(challenge.expiresInSeconds || 300) * 1000);
      captcha.src = challenge.image;
    }).catch(function(error) {
      finish();
      showLinkApplicationMessage(error.message || '验证码加载失败，请点击图片重试。', 'error', 5000);
    });
  }

  function closeLinkApplication() {
    var modal = document.getElementById('linkApplicationModal');
    if (!modal) return;
    modal.hidden = true;
    document.body.classList.remove('link-application-open');
    document.querySelector('.links-apply-trigger')?.setAttribute('aria-expanded', 'false');
  }

  function showLinkApplicationMessage(message, kind, duration, inline) {
    var feedback = document.querySelector('#linkApplicationModal .link-application-feedback');
    if (feedback && inline !== false) {
      feedback.textContent = message;
      feedback.hidden = false;
      feedback.style.color = kind === 'error' ? '#ff8994' : (kind === 'success' ? '#65cf9c' : 'inherit');
      if (kind && !document.getElementById('linkApplicationModal')?.hidden) {
        feedback.scrollIntoView({ block: 'nearest' });
      }
    }
    var toast = document.getElementById('linkApplicationToast');
    if (!toast) return;
    window.clearTimeout(window.__linkApplicationToastTimer);
    toast.textContent = message;
    toast.classList.remove('is-success', 'is-error', 'is-loading');
    toast.classList.add('visible', kind ? 'is-' + kind : 'is-loading');
    if (duration) window.__linkApplicationToastTimer = window.setTimeout(function() { toast.classList.remove('visible'); }, duration);
  }

  function submitLinkApplication(event, form) {
    if (event) event.preventDefault();
    if (!form || form.dataset.submitting === 'true') return false;
    var submit = form.querySelector('button[type="submit"]');
    var captcha = form.querySelector('input[name="captchaCode"]');
    if (form.dataset.captchaReady !== 'true' || !form.dataset.challengeId) {
      showLinkApplicationMessage('请等待验证码加载完成，或点击验证码图片重新加载。', 'error', 5000);
      return false;
    }
    if (Date.now() >= Number(form.dataset.captchaExpiresAt)) {
      showLinkApplicationMessage('验证码已过期，已为你刷新，请填写新验证码。', 'error', 5000);
      refreshLinkApplicationCaptcha(form);
      return false;
    }
    if (!captcha || !captcha.value.trim()) {
      showLinkApplicationMessage('请先填写验证码。', 'error', 4000);
      captcha?.focus();
      return false;
    }
    form.dataset.submitting = 'true';
    if (submit) { submit.disabled = true; submit.textContent = '提交中…'; }
    showLinkApplicationMessage('正在提交申请，请稍候…', null, 0);
    var data = new FormData(form);
    var body = {};
    ['url', 'displayName', 'logo', 'description', 'email', 'backlink'].forEach(function(name) {
      body[name] = String(data.get(name) || '').trim();
    });
    var cover = String(data.get('cover') || '').trim();
    if (cover) body.cover = cover;
    body.feedUrls = String(data.get('feedUrls') || '').split(/[\s,]+/).filter(Boolean);
    body.challengeId = form.dataset.challengeId;
    body.captchaCode = captcha.value.trim();
    var controller = new AbortController();
    var timeout = window.setTimeout(function() { controller.abort(); }, 20000);
    fetch('/apis/api.link.halo.run/v1alpha1/link-applications', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(body),
      signal: controller.signal,
      redirect: 'follow',
      cache: 'no-store'
    }).then(async function(response) {
      var result = await response.json().catch(function() { return {}; });
      if (!response.ok) {
        var errors = Array.isArray(result.errors) ? result.errors.join('；') : '';
        throw new Error(errors || result.detail || ('申请提交失败（HTTP ' + response.status + '）'));
      }
      if (!result.id) throw new Error('未收到申请成功确认，请稍后查看申请状态。');
      showLinkApplicationMessage('友链申请提交成功，请等待站长审核。', 'success', 5000);
      form.reset();
      form.dataset.captchaReady = 'false';
      form.dataset.captchaLoaded = 'false';
      delete form.dataset.challengeId;
      window.setTimeout(closeLinkApplication, 800);
    }).catch(function(error) {
      showLinkApplicationMessage(error.name === 'AbortError' ? '提交超时，结果暂未确认。请稍后再试，避免重复提交。' : (error.message || '申请提交失败，请稍后重试。'), 'error', 5000);
      captcha.value = '';
      form.dataset.submitting = 'false';
      refreshLinkApplicationCaptcha(form.closest('#linkApplicationModal') || document);
    }).finally(function() {
      window.clearTimeout(timeout);
      form.dataset.submitting = 'false';
      if (submit) { submit.disabled = form.dataset.captchaReady === 'false'; submit.textContent = '提交申请'; }
    });
    return false;
  }

  (function() {
    var params = new URLSearchParams(window.location.search);
    var status = params.get('applied');
    if (!status) return;
    showLinkApplicationMessage(status === 'success' ? '友链申请提交成功，请等待站长审核。' : (params.get('message') || '友链申请提交失败，请检查填写内容后重试。'), status === 'success' ? 'success' : 'error', 5000);
    params.delete('applied'); params.delete('field'); params.delete('message');
    var query = params.toString();
    window.history.replaceState({}, document.title, window.location.pathname + (query ? '?' + query : '') + window.location.hash);
  }());
  </script>

</th:block>
</html>
