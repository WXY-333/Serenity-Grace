<html xmlns:th="https://www.thymeleaf.org"

<th:block th:fragment="head">
  <link rel="stylesheet" th:href="@{/assets/css/archives.css}" />
  <link rel="stylesheet" th:href="@{/assets/css/archive-profile.css}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" th:content="${((theme.config.watermark?.archives?.enabled == true ? theme.config.watermark.archives.title : null) ?: '归档') + ' - ' + (theme.config.basic != null and theme.config.basic.siteInfo != null and theme.config.basic.siteInfo.title != null ? theme.config.basic.siteInfo.title : site.title)}" />
  <meta property="og:description" th:content="${'全部文章归档列表'}" />

<th:block th:fragment="content">

          th:attr="data-comment-provider=${theme.config.sidebar?.recentCommentsConfig?.avatarComponent ?: 'auto'}" defer></script>
  <script th:src="@{/assets/js/archives.js}" defer></script>
  <script th:src="@{/assets/js/archive-profile.js}" defer></script>

  <script th:src="@{/assets/js/tag-sphere.js}" defer></script>

              <th:block th:each="month : ${archive.months}">

                    </svg>

                  </div>
                  <div class="archive-card-content">
                    <h2 class="archive-card-title" th:text="${post.spec.title}">文章标题</h2>
                    <p class="archive-card-desc" th:text="${post.status.excerpt ?: '暂无摘要...'}">文章摘要...</p>
                    <div class="archive-card-meta">

                        </span>
                      </div>
                      <div class="archive-card-tags" th:if="${post.tags != null and not #lists.isEmpty(post.tags)}">

                    </div>
                  </div>
                  <span class="archive-card-month" th:text="${#temporals.format(post.spec.publishTime, 'M') + '月'}">1月</span>

                </a>

              </svg>
            </a>
            <span th:unless="${archives.hasPrevious()}" class="pagination-arrow disabled">

              </svg>

                <path d="M9 18l6-6-6-6"/>
              </svg>
            </a>
            <span th:unless="${archives.hasNext()}" class="pagination-arrow disabled">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M9 18l6-6-6-6"/>
              </svg>
            </span>
          </div>
        </nav>

          <div class="widget-header">
            <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span class="widget-divider"></span>
            <span class="widget-title">活动日历</span>
          </div>

          <div class="activity-calendar-toolbar">
            <button type="button" class="activity-calendar-nav" data-calendar-action="previous" title="上个月" aria-label="上个月">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button type="button" class="activity-calendar-month" data-calendar-action="today" title="回到今天"></button>
            <button type="button" class="activity-calendar-nav" data-calendar-action="next" title="下个月" aria-label="下个月">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>

          <div class="activity-calendar-weekdays" aria-hidden="true">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div class="activity-calendar-days" role="grid" aria-label="月历"></div>

          <div class="activity-calendar-month-labels" aria-hidden="true"></div>
          <div class="activity-calendar-heatmap" role="grid" aria-label="年度活动热力图"></div>
          <div class="activity-calendar-tooltip" role="tooltip" hidden></div>

          <div class="archive-activity-seed" hidden aria-hidden="true">
            <th:block th:if="${momentFinder != null && (theme.config.sidebar == null || theme.config.sidebar.activityCalendarConfig == null || theme.config.sidebar.activityCalendarConfig.includeMoments == null || theme.config.sidebar.activityCalendarConfig.includeMoments)}"
                      th:with="calendarMoments=${momentFinder.list(1, 9999)}">
              <time th:each="moment : ${calendarMoments.items}"
                    th:if="${moment.spec.releaseTime != null}"
                    data-activity-type="moment"
                    th:attr="data-activity-date=${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd')}"></time>
            </th:block>
            <th:block th:if="${photoFinder != null && (theme.config.sidebar == null || theme.config.sidebar.activityCalendarConfig == null || theme.config.sidebar.activityCalendarConfig.includePhotos == null || theme.config.sidebar.activityCalendarConfig.includePhotos)}"
                      th:with="calendarPhotoGroups=${photoFinder.groupBy()}">
              <th:block th:each="group : ${calendarPhotoGroups}">
                <time th:each="photo : ${group.photos}"
                      th:if="${photo.metadata.creationTimestamp != null}"
                      data-activity-type="photo"
                      th:attr="data-activity-date=${#temporals.format(photo.metadata.creationTimestamp, 'yyyy-MM-dd')}"></time>
              </th:block>
            </th:block>
          </div>
        </section>

        <div class="sidebar-widget" data-sidebar-component="fortune" th:if="${theme.config.sidebar == null || theme.config.sidebar.fortuneConfig == null || theme.config.sidebar.fortuneConfig.showFortune == null || theme.config.sidebar.fortuneConfig.showFortune}">
          <div class="widget-header">
            <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="widget-divider"></span>
            <span class="widget-title">一言</span>
          </div>
          <div class="widget-hitokoto" id="hitokoto-widget" th:attr="data-api=${theme.config.sidebar != null && theme.config.sidebar.fortuneConfig != null && theme.config.sidebar.fortuneConfig.hitokotoApi != null && !#strings.isEmpty(theme.config.sidebar.fortuneConfig.hitokotoApi) ? theme.config.sidebar.fortuneConfig.hitokotoApi : 'https://v1.hitokoto.cn/?c=a&c=b&c=c&c=d&c=i&c=k'}">
            <p class="hitokoto-text" id="hitokoto-text">热爱可抵岁月漫长</p>
            <p class="hitokoto-from" id="hitokoto-from"></p>
          </div>
        </div>

        <div class="sidebar-widget" data-sidebar-component="hotPosts" th:if="${theme.config.sidebar == null || theme.config.sidebar.hotPostsConfig == null || theme.config.sidebar.hotPostsConfig.showHotPosts == null || theme.config.sidebar.hotPostsConfig.showHotPosts}" th:with="hotPostsCount = ${theme.config.sidebar != null && theme.config.sidebar.hotPostsConfig != null && theme.config.sidebar.hotPostsConfig.hotPostsCount != null ? theme.config.sidebar.hotPostsConfig.hotPostsCount : 5}">
          <div class="widget-header">
            <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span class="widget-divider"></span>
            <span class="widget-title">热门文章</span>
          </div>
          <ul class="widget-list">
            <th:block th:if="${not #lists.isEmpty(postFinder.list(1, hotPostsCount).items)}">
              <li th:each="post : ${postFinder.list(1, hotPostsCount).items}">
                <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}">文章标题</a>
              </li>
            </th:block>
            <th:block th:if="${#lists.isEmpty(postFinder.list(1, hotPostsCount).items)}">
              <li style="text-align:center;padding:1rem 0;color:var(--color-text-muted);opacity:0.6;font-size:0.85rem;">暂无文章</li>
            </th:block>
          </ul>
        </div>

        <div class="sidebar-widget" data-sidebar-component="recentComments" th:if="${theme.config.sidebar == null || theme.config.sidebar.recentCommentsConfig == null || theme.config.sidebar.recentCommentsConfig.showRecentComments == null || theme.config.sidebar.recentCommentsConfig.showRecentComments}" th:attr="data-comment-count=${theme.config.sidebar != null && theme.config.sidebar.recentCommentsConfig != null && theme.config.sidebar.recentCommentsConfig.recentCommentsCount != null ? theme.config.sidebar.recentCommentsConfig.recentCommentsCount : 3}">
          <div class="widget-header">
            <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="widget-divider"></span>
            <span class="widget-title">最新评论</span>
          </div>
          <div class="widget-comments" id="latestComments">
            <div class="comment-loading">加载中...</div>
          </div>
          <div id="archiveCommentData" hidden th:with="comments=${commentFinder.list(null, 1, 0)}">
            <span th:each="comment : ${comments.items}"
                  th:if="${comment.spec.approved == true and comment.spec.hidden != true and comment.metadata.deletionTimestamp == null}"
                  th:attr="data-comment-name=${comment.metadata.name},
                           data-created=${comment.spec.creationTime ?: comment.metadata.creationTimestamp},
                           data-content=${comment.spec.content},
                           data-author=${comment.owner?.displayName},
                           data-avatar=${comment.owner?.avatar},
                           data-owner-kind=${comment.owner?.kind},
                           data-email-hash=${comment.spec.owner?.annotations != null ? comment.spec.owner.annotations['email-hash'] : ''},
                           data-subject-kind=${comment.spec.subjectRef.kind},
                           data-subject-name=${comment.spec.subjectRef.name}"></span>
          </div>
        </div>

        <div class="sidebar-widget" data-sidebar-component="tagCloud" th:if="${theme.config.sidebar == null || theme.config.sidebar.tagCloudConfig == null || theme.config.sidebar.tagCloudConfig.showTagCloud == null || theme.config.sidebar.tagCloudConfig.showTagCloud}">
          <div class="widget-header">
            <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            <span class="widget-divider"></span>
            <span class="widget-title">标签云</span>
          </div>
          <div class="widget-tags widget-tags-sphere" id="tagSphere">
            <th:block th:if="${not #lists.isEmpty(tagFinder.listAll())}">
              <a th:each="tag : ${tagFinder.listAll()}" 
                 th:href="@{${tag.status.permalink}}" 
                 class="widget-tag" 
                 th:text="${tag.spec.displayName}">标签</a>
            </th:block>
            <th:block th:if="${#lists.isEmpty(tagFinder.listAll())}">
              <span class="widget-tag" style="opacity:0.5;cursor:default;">暂无标签</span>
            </th:block>
          </div>
          <a th:if="${#lists.size(tagFinder.listAll()) > 6}" th:href="@{/tags}" class="widget-tags-more">
            查看更多 <span>&gt;</span>
          </a>
        </div>
      </aside>
    </div>
  </div>

</th:block>
</html>
